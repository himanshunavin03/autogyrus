[project]
name = "autogyrus-search"
version = "0.1.0"
description = "Derived semantic and hybrid search over AutoGyrus canonical MySQL data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "spacy>=3.8,<4",
  "spacy-lookups-data>=1.0,<2",
  "rapidfuzz>=3.9,<4",
  "sentence-transformers>=3.3,<6",
  "qdrant-client>=1.12,<2",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
autogyrus-search = "autogyrus_search.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
autogyrus_search = ["ontology.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
